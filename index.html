<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC Online Simulator - Multi-Sell & Modular Auth</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #070a0e;
      --panel-bg: rgba(13, 20, 32, 0.95);
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent-green: #00ff88;
      --accent-blue: #00d2ff;
      --accent-gold: #ffb700;
      --accent-red: #ff4757;
      --text-main: #f1f2f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    
    header { background: rgba(8, 12, 18, 0.98); padding: 10px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--panel-border); position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 18px; font-weight: 900; background: linear-gradient(45deg, #00d2ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .user-profile { display: flex; align-items: center; gap: 12px; }
    .user-info, .bp-display { background: rgba(255,255,255,0.06); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--panel-border); display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .bp-display { color: var(--accent-gold); font-weight: bold; border-color: var(--accent-gold); }
    .btn-logout { background: rgba(255, 71, 87, 0.2); border: 1px solid var(--accent-red); color: var(--accent-red); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 11px; }

    nav { display: flex; justify-content: center; gap: 6px; padding: 10px; background: rgba(0,0,0,0.7); border-bottom: 1px solid var(--panel-border); flex-wrap: wrap; }
    .nav-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); color: #aaa; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.2s; }
    .nav-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-btn.active { background: linear-gradient(135deg, var(--accent-blue), var(--accent-green)); color: #000; border-color: transparent; }
    .nav-btn.admin-btn { background: rgba(255, 71, 87, 0.15); border-color: var(--accent-red); color: var(--accent-red); }

    main { flex: 1; padding: 15px; max-width: 1400px; width: 100%; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    #gameToast { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(13, 20, 32, 0.98); border: 1px solid var(--accent-green); color: #fff; padding: 10px 25px; border-radius: 25px; font-weight: bold; font-size: 13px; z-index: 2000; box-shadow: 0 5px 20px rgba(0,0,0,0.8); transition: transform 0.3s ease; pointer-events: none; }
    #gameToast.show { transform: translateX(-50%) translateY(0); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); }
    .auth-box { background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 30px; border-radius: 12px; width: 340px; text-align: center; }
    .input-group { margin-bottom: 12px; text-align: left; }
    .input-group label { display: block; margin-bottom: 4px; font-size: 11px; color: #aaa; }
    .input-group input { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--panel-border); background: rgba(0,0,0,0.6); color: #fff; outline: none; font-size: 13px; }
    .btn-submit { width: 100%; padding: 10px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-green)); border: none; border-radius: 6px; font-weight: bold; font-size: 13px; color: #000; cursor: pointer; }

    .player-table-container { background: rgba(13, 20, 32, 0.85); border: 1px solid var(--panel-border); border-radius: 10px; overflow: hidden; }
    .player-list-table { width: 100%; border-collapse: collapse; }
    .player-list-table th, .player-list-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
    .player-list-table th { background: rgba(0,0,0,0.6); color: #888; font-weight: 600; text-transform: uppercase; font-size: 10px; }
    .btn-action-table { background: #00b894; color: #000; border: none; padding: 5px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }

    .market-actions-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--panel-border); }
  </style>
</head>
<body>

  <div id="gameToast">Thông báo game</div>

  <!-- Modal Đăng nhập -->
  <div id="loginModal" class="modal-overlay">
    <div class="auth-box">
      <h2><i class="fa-solid fa-futbol"></i> ĐĂNG NHẬP HỆ THỐNG</h2>
      <form id="loginForm">
        <div class="input-group">
          <label>Tên Tài Khoản:</label>
          <input type="text" id="usernameInput" required placeholder="Nhập tên tài khoản...">
        </div>
        <div class="input-group">
          <label>Mật Khẩu:</label>
          <input type="password" id="passwordInput" required placeholder="Nhập mật khẩu...">
        </div>
        <button type="submit" class="btn-submit">VÀO GAME</button>
      </form>
    </div>
  </div>

  <header>
    <div class="logo"><i class="fa-solid fa-trophy"></i> FC ONLINE SIMULATOR</div>
    <div class="user-profile">
      <div class="user-info"><i class="fa-solid fa-user"></i> <span id="displayUsername">Khách</span></div>
      <div class="bp-display"><i class="fa-solid fa-coins"></i> <span id="bpCount">0</span> BP</div>
      <button class="btn-logout" onclick="authLogout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
    </div>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('marketTab')">THỊ TRƯỜNG (BÁN NHIỀU)</button>
    <button class="nav-btn" onclick="switchTab('packTab')">MỞ GÓI THẺ</button>
  </nav>

  <main>
    <!-- Tab Chợ - Tính năng chọn bán nhiều cầu thủ -->
    <div id="marketTab" class="tab-content active">
      <h2 style="font-size: 14px; margin-bottom: 10px; color: var(--accent-blue);">Thị Trường Chuyển Nhượng - Bán Nhiều Cầu Thủ</h2>
      
      <div class="market-actions-bar">
        <div>
          <input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)"> <label for="selectAllCheckbox" style="font-size: 12px; cursor: pointer;">Chọn tất cả</label>
        </div>
        <button class="btn-action-table" style="background: var(--accent-gold);" onclick="sellSelectedPlayers()">Bán Các Thẻ Đã Chọn</button>
      </div>

      <div class="player-table-container">
        <table class="player-list-table">
          <thead>
            <tr><th><i class="fa-solid fa-check"></i></th><th>Cầu Thủ</th><th>Mùa</th><th>OVR</th><th>Giá Bán</th></tr>
          </thead>
          <tbody id="myMarketTable"></tbody>
        </table>
      </div>
    </div>

    <!-- Tab Mở Gói để kiếm cầu thủ -->
    <div id="packTab" class="tab-content">
      <h2 style="font-size: 14px; margin-bottom: 10px; color: var(--accent-gold);">Mở Gói Nhận Cầu Thủ</h2>
      <button class="btn-submit" style="width: auto; padding: 8px 18px;" onclick="openPacks(10)">Mở x10 Gói Thẻ</button>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 15px;" id="packResultGrid"></div>
    </div>
  </main>

  <!-- Tách file riêng biệt -->
  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
